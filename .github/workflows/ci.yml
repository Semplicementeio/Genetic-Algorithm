name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Test, Vet & Race Detector
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Build Library & Examples
        run: |
          go build ./...
          go build ./examples/...

      - name: Run Unit, Property & Contract Tests with Race Detector
        run: go test -v -race ./genetic/...

      - name: Run Fuzz Tests
        run: go test -v -fuzz=FuzzEngine -fuzztime=10s ./genetic

      - name: Run Benchmarks
        run: go test -v -bench=. -benchmem ./benchmarks
