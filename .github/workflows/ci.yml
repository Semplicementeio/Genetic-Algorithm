name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Test, Vet & Race Detector
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', 'stable' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Build Library & Examples
        run: |
          go build ./...
          go build ./examples/...

      - name: Run Unit, Property, Contract & Example Smoke Tests with Race Detector
        run: go test -race ./...

      - name: Run Fuzz Tests
        run: go test -run='^$' -fuzz=FuzzEngineConfig -fuzztime=10s ./genetic

      - name: Run Benchmarks
        run: go test -run='^$' -bench=. -benchtime=1x -benchmem ./benchmarks
